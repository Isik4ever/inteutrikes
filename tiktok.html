<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TikTok-inloggning – Inte Utrikes</title>
<style>body{max-width:640px;margin:60px auto;padding:0 20px;font-family:-apple-system,Helvetica,Arial,sans-serif;line-height:1.6;color:#111;text-align:center}code{display:block;background:#f3f3f3;padding:14px;border-radius:8px;word-break:break-all;font-size:15px;margin:16px 0}button{background:#e10600;color:#fff;border:0;padding:12px 20px;border-radius:8px;font-size:16px;cursor:pointer}.err{color:#b00}</style></head>
<body>
<h1>Inte Utrikes</h1>
<p id="msg">Hämtar koden…</p>
<code id="code"></code>
<button id="copy" style="display:none">Kopiera koden</button>
<p id="hint" style="display:none">Klistra in koden i Terminalen där <strong>./iu tiktok --auth</strong> väntar. Sedan kan du stänga fliken.</p>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), err = q.get("error");
  if (err) { document.getElementById("msg").innerHTML = '<span class="err">TikTok sa nej: ' + err + ' ' + (q.get("error_description") || '') + '</span>'; }
  else if (code) {
    document.getElementById("msg").textContent = "Inloggningen lyckades. Din kod:";
    document.getElementById("code").textContent = code;
    const b = document.getElementById("copy"); b.style.display = "inline-block"; document.getElementById("hint").style.display = "block";
    b.onclick = () => navigator.clipboard.writeText(code).then(() => b.textContent = "Kopierad");
  } else { document.getElementById("msg").textContent = "Ingen kod i adressen. Starta om med ./iu tiktok --auth."; }
</script>
</body>
</html>
